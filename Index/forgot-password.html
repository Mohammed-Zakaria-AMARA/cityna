<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Cityna</title>
  <link rel="stylesheet" href="./CSS/forgot-password-style.css" />
  <link rel="stylesheet" href="./CSS/global-styling.css" />
</head>
<body>
  <header>
    <a href="./citizen-form.html" class="logo">CITYNA</a>
    <div class="buttons">
      <a href="./log-in.html" class="btn primaryBtn">Log in</a>
      <a href="./sign-up.html" class="btn secondaryBtn">Sign Up</a>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h1>Forgot Password</h1>
      <p class="info-text">Enter your email address and we will send you a link to reset your password.</p>
      <form>
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required />
        
        <button type="submit" class="btn primaryBtn submit">Send Reset Link</button>

        <div class="extra-links">
          <a href="./log-in.html">Back to Log In</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
