<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cityna Report Form</title>
  <link rel="stylesheet" href="./CSS/citizen-form-style.css" />
  <link rel="stylesheet" href="./CSS/global-styling.css">
</head>
<body>
  <header>
    <a href="./citizen-form.html" class="logo">CITYNA</a>
    <div class="buttons">
      <a href="./log-in.php" class="btn primaryBtn">Log in</a>
      <a href="./sign-up.html" class="btn secondaryBtn">Sign Up</a>
    </div>
  </header>
  <main>
    <div class="form-container">
      <h1>Report Form</h1>
      <form action="citizen-form.php" method="POST" id="reportForm">
        
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" />

        <label for="phone_number">Numero de Telephone</label>
        <input type="tel" id="phone_number" name="phone_number" placeholder="Enter your phone number" />

        <label>Real-Time Picture</label>
        <div class="camera-container">
          <video id="cameraPreview" autoplay playsinline style="display:none;"></video>
          <canvas id="photoCanvas" style="display:none;"></canvas>
          <div id="cameraControls">
            <button type="button" id="startCamera" class="btn secondaryBtn">Start Camera</button>
            <button type="button" id="takePhoto" class="btn primaryBtn" style="display:none;">Take Photo</button>
            <button type="button" id="retakePhoto" class="btn secondaryBtn" style="display:none;">Retake</button>
          </div>
          <img id="photoPreview" style="display:none;">
          <input type="file" name="report_image" id="fileInput" accept="image/*" capture="environment" style="display:none;">
        </div>

        <label for="commune">Commune</label> 
        <input type="text" id="commune" name="commune" value="Mostaganem" required /> 

        <label for="wilaya">Wilaya</label>
        <input type="text" id="wilaya" name="wilaya" value="Mostaganem" required />

        <label for="geolocation">Geolocation</label>
        <input type="text" id="geolocation" name="geolocation" placeholder="Click to use my current location" />

        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Please provide more details about the issue"></textarea>

        <label for="category">Catégorie</label>
        <select id="category" name="category" required>
          <option value="">-- Sélectionnez une catégorie --</option>
          <option value="Sécurité Publique">Sécurité Publique</option>
          <option value="Propreté et environnement">Propreté et environnement</option>
          <option value="Gaz">Gaz</option>
          <option value="Routes et voirie">Routes et voirie</option>
          <option value="Électricité">Électricité</option>
          <option value="Eau">Eau</option>
        </select>

        <label for="subcategory">Sous-catégorie</label>
        <select id="subcategory" name="subcategory" required>
          <option value="">-- Sélectionnez une sous-catégorie --</option>
        </select>

        <button type="submit" class="btn primaryBtn submit">Envoyer</button>
      </form>
    </div>
  </main>
  <script src="./JS/form-dropdown.js"></script>
  <script src="./JS/camera-real-time-picture.js"></script>
</body>
</html>
